    division: 'SERIE CUP',
    title: '',
    status: 'INSCRIPCIONES ABIERTAS',
    totalPrizeOrPool: '',
    inscriptionCost: '',
    metodosPago: 'Transferencia, Yape/Nequi, PayPal, Binance',
    comprobantePago: '',
    hora: '20:00 hrs (GMT-5)',
    fecha: 'Próximo Viernes',
    cantidadSalas: 4,
    linkGrupo: '',
    bannerPhoto: '',
    registeredTeamsText: '',
    description: ''
  });

  // Registration & Payment input per activity
  const [regInputs, setRegInputs] = useState({});

  // News, Sponsors, Role Accounts & Toast
  const [newsList, setNewsList] = useState(INITIAL_NEWS);
  const [newNews, setNewNews] = useState({
    tag: 'ANUNCIO OFICIAL',
    division: 'ELITE',
    title: '',
    summary: ''
  });

  const [sponsors, setSponsors] = useState(INITIAL_SPONSORS);
  const [newSponsor, setNewSponsor] = useState({
    name: '',
    tier: 'OFFICIAL SPONSOR',
    url: 'https://',
    benefit: ''
  });

  const [roleAccounts, setRoleAccounts] = useState(INITIAL_ROLE_ACCOUNTS);
  const [newAccount, setNewAccount] = useState({
    name: '',
    handle: '',
    role: 'EQUIPOS'
  });

  const [sponsorInquiry, setSponsorInquiry] = useState({
    company: '',
    email: '',
    division: 'ELITE',
    message: ''
  });

  const [toast, setToast] = useState(null);
  const [pendingRegistrations, setPendingRegistrations] = useState(INITIAL_PENDING_REGISTRATIONS);

  const pushLiveEvent = (message, actorOverride) => {
    const actor = actorOverride || currentRole;
    const entry = {
      id: `feed-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      actor,
      message
    };
    setLiveFeed((prev) => [entry, ...prev].slice(0, 35));
    return entry;
  };

  const notify = (message, type = 'success', options = {}) => {
    setToast({ message, type });
    if (options.recordFeed !== false && type !== 'error') {
      pushLiveEvent(message, options.actor);
    }
    setTimeout(() => {
      setToast((prev) => (prev?.message === message ? null : prev));
    }, 3800);
  };

  useEffect(() => {
    if (typeof window === 'undefined' || typeof window.BroadcastChannel === 'undefined') {
      setLiveSyncStatus('LIVE LOCAL • TIEMPO REAL');
      return;
    }

    const channel = new window.BroadcastChannel(LIVE_CHANNEL_NAME);
    broadcastRef.current = channel;
    setLiveSyncStatus('LIVE SYNC • TIEMPO REAL');

    channel.onmessage = (event) => {
      const payload = event?.data;
      if (!payload || payload.senderId === clientIdRef.current) return;

      isRemoteUpdateRef.current = true;
      if (payload.type === 'STATE_SNAPSHOT' && payload.snapshot) {
        const snap = payload.snapshot;
        if (snap.teams) setTeams(snap.teams);
        if (snap.activities) setActivities(snap.activities);
        if (snap.newsList) setNewsList(snap.newsList);
        if (snap.sponsors) setSponsors(snap.sponsors);
        if (snap.corporateInfo) setCorporateInfo(snap.corporateInfo);
        if (snap.roleAccounts) setRoleAccounts(snap.roleAccounts);
        if (snap.pendingRegistrations) setPendingRegistrations(snap.pendingRegistrations);
      }

      if (payload.liveMessage) {
        const remoteEntry = {
          id: `remote-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          actor: payload.actor || 'REMOTO',
          message: payload.liveMessage
        };
        setLiveFeed((prev) => [remoteEntry, ...prev].slice(0, 35));
        setToast({ message: `En vivo: ${payload.liveMessage}`, type: 'success' });
        setTimeout(() => {
          setToast(null);
        }, 3800);
      }

      setTimeout(() => {
        isRemoteUpdateRef.current = false;
      }, 40);
    };

    return () => {
      channel.close();
      broadcastRef.current = null;
    };
  }, []);

  const broadcastStateChange = (liveMessage, actorOverride) => {
    try {
      window.sessionStorage?.setItem(
        STORAGE_BACKUP_KEY,
        JSON.stringify({
          teams,
          activities,
          newsList,
          sponsors,
          corporateInfo,
          roleAccounts,
          pendingRegistrations
        })
      );
    } catch {
      // Ignore storage quota or restricted context errors
    }

    if (broadcastRef.current && !isRemoteUpdateRef.current) {
      broadcastRef.current.postMessage({
        senderId: clientIdRef.current,
        type: 'STATE_SNAPSHOT',
        actor: actorOverride || currentRole,
        liveMessage,
        snapshot: {
          teams,
          activities,
          newsList,
          sponsors,
          corporateInfo,
          roleAccounts,
          pendingRegistrations
        }
      });
    }
  };

  const handleImageUpload = (file, onSuccess) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      if (typeof reader.result === 'string') {
        onSuccess(reader.result);
      }
    };
    reader.onerror = () => {
      notify('No se pudo cargar la imagen seleccionada.', 'error');
    };
    reader.readAsDataURL(file);
  };

  const computeTotalPoints = (team) => {
    const pos = Number(team.positionPts) || 0;
    const kills = Number(team.kills) || 0;
    const booyahs = Number(team.booyahs) || 0;
    const penalties = Number(team.penalties) || 0;
    return pos + kills + booyahs * 12 - penalties;
  };

  const rankedTeams = useMemo(() => {
    const filtered =
      activeDivisionFilter === 'TODAS'
        ? teams
        : teams.filter((t) => t.division === activeDivisionFilter);

    return [...filtered]
      .map((team) => ({
        ...team,
        totalPoints: computeTotalPoints(team)
      }))
      .sort((a, b) => {
        if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
        if ((b.booyahs || 0) !== (a.booyahs || 0)) return (b.booyahs || 0) - (a.booyahs || 0);
        return (b.kills || 0) - (a.kills || 0);
      });
  }, [teams, activeDivisionFilter]);

  const selectedTeam = useMemo(() => {
    return teams.find((t) => t.id === selectedTeamId) || teams[0] || null;
  }, [teams, selectedTeamId]);

  const handleAddPlayerSlotInBuilder = () => {
    setNewTeamPlayers((prev) => [...prev, createEmptyPlayer(prev.length + 1)]);
  };

  const handleRemovePlayerSlotInBuilder = (playerId) => {
    setNewTeamPlayers((prev) => {
      if (prev.length <= 1) {
        notify('Debe existir al menos 1 jugador en el formato.', 'error');
        return prev;
      }
      return prev.filter((p) => p.id !== playerId).map((p, idx) => ({ ...p, slotNumber: idx + 1 }));
    });
  };

  const handleUpdateBuilderPlayer = (playerId, field, value) => {
    setNewTeamPlayers((prev) =>
      prev.map((p) => (p.id === playerId ? { ...p, [field]: value } : p))
    );
  };

  const handleAddCustomFieldToBuilderPlayer = (playerId) => {
    setNewTeamPlayers((prev) =>
      prev.map((p) =>
        p.id === playerId
          ? { ...p, customFields: [...(p.customFields || []), createCustomField('Dato Extra', '')] }
          : p
      )
    );
  };

  const handleUpdateCustomFieldInBuilderPlayer = (playerId, fieldId, key, val) => {
    setNewTeamPlayers((prev) =>
      prev.map((p) => {
        if (p.id !== playerId) return p;
        return {
          ...p,
          customFields: (p.customFields || []).map((cf) =>
            cf.id === fieldId ? { ...cf, [key]: val } : cf
          )
        };
      })
    );
  };

  const handleRemoveCustomFieldInBuilderPlayer = (playerId, fieldId) => {
    setNewTeamPlayers((prev) =>
      prev.map((p) => {
        if (p.id !== playerId) return p;
        return {
          ...p,
          customFields: (p.customFields || []).filter((cf) => cf.id !== fieldId)
        };
      })
    );
  };

  const handleCreateTeam = (e) => {
    e.preventDefault();
    const cleanName = newTeamName.trim();
    if (!cleanName) {
      notify('Ingresa el nombre del equipo antes de registrar.', 'error');
      return;
    }

    const createdTeam = {
      id: `team-${Date.now()}`,
      name: cleanName.toUpperCase(),
      logoPng: newTeamLogoPng,
      country: newTeamCountry.trim() || 'LATAM',
      division: newTeamDivision,
      positionPts: Number(newTeamPosPts) || 0,
      kills: Number(newTeamKills) || 0,
      booyahs: Number(newTeamBooyahs) || 0,
      penalties: 0,

      history:
        newTeamHistory.trim() ||

      players: newTeamPlayers.map((p, idx) => ({
        ...p,
        slotNumber: idx + 1,
        gameNick: p.gameNick.trim() || `JUGADOR_${idx + 1}`,
        realName: p.realName.trim() || `Integrante ${idx + 1}`

    };

    setTeams((prev) => [...prev, createdTeam]);
    setSelectedTeamId(createdTeam.id);
    const msg = `${currentRole} creó el equipo "${createdTeam.name}" (${createdTeam.players.length} jugadores).`;
    broadcastStateChange(msg, currentRole);
    setNewTeamName('');
    setNewTeamLogoPng('');
    setNewTeamHistory('');
    setNewTeamPosPts(0);
    setNewTeamKills(0);
    setNewTeamBooyahs(0);
    setNewTeamPlayers([
      createEmptyPlayer(1),
      createEmptyPlayer(2),
      createEmptyPlayer(3),
      createEmptyPlayer(4),
      createEmptyPlayer(5),
      createEmptyPlayer(6)
    ]);
    notify(`Equipo "${createdTeam.name}" registrado con ${createdTeam.players.length} jugadores y tabla actualizada.`, 'success', {
      recordFeed: true
    });
  };

  const handleAddPlayerToExistingTeam = (teamId) => {
    const targetTeam = teams.find((t) => t.id === teamId);
    setTeams((prev) =>
      prev.map((t) => {
        if (t.id !== teamId) return t;
        const nextNum = t.players.length + 1;
        return {
          ...t,
          players: [...t.players, createEmptyPlayer(nextNum)]
        };
      })
    );
    const msg = `${currentRole} añadió un nuevo jugador al roster de ${targetTeam?.name || 'equipo'}.`;
    broadcastStateChange(msg, currentRole);
    notify('Nuevo slot de jugador añadido al equipo.');
  };

  const handleUpdateExistingPlayer = (teamId, playerId, field, value) => {
    setTeams((prev) =>
      prev.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          players: t.players.map((p) => (p.id === playerId ? { ...p, [field]: value } : p))
        };
      })
    );
  };

  const handleAddCustomFieldToExistingPlayer = (teamId, playerId) => {
    setTeams((prev) =>
      prev.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          players: t.players.map((p) =>
            p.id === playerId
              ? { ...p, customFields: [...(p.customFields || []), createCustomField('Campo Extra', '')] }
              : p
          )
        };
      })
    );
  };

  const handleUpdateExistingCustomField = (teamId, playerId, cfId, key, val) => {

      prev.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          players: t.players.map((p) => {

          })

  const handleUpdateTeamStats = (teamId, field, value) => {
    const num = Math.max(0, Number(value) || 0);
    const target = teams.find((t) => t.id === teamId);
    setTeams((prev) =>
      prev.map((t) => (t.id === teamId ? { ...t, [field]: num } : t))

    broadcastStateChange(
      `${currentRole} actualizó ${field} (${num}) en ${target?.name || 'equipo'} y reordenó la tabla.`,

  const handleCreateActivity = (e) => {

    const created = {
      id: `act-${Date.now()}`,
      kind: newActivity.kind,

      hora: newActivity.hora.trim() || 'Por confirmar',
      fecha: newActivity.fecha.trim() || 'Por confirmar',
      cantidadSalas: Math.max(1, Number(newActivity.cantidadSalas) || 1),
      linkGrupo: newActivity.linkGrupo.trim() || 'https://nationaltournaments.esports/grupo',

      registeredTeams: parsedTeams,
      description:

    broadcastStateChange(`${currentRole} publicó ${created.kind}: "${created.title}".`, currentRole);

      title: '',
      totalPrizeOrPool: '',
      inscriptionCost: '',
      comprobantePago: '',
      linkGrupo: '',
      bannerPhoto: '',
      registeredTeamsText: '',
      description: ''
    }));
    notify(`Actividad (${created.kind}) publicada y disponible para inscripciones.`);
  };

  const handleRegisterInActivity = (activityId) => {
    const inputState = regInputs[activityId] || {};
    const teamName = (inputState.teamName || '').trim().toUpperCase();
    const paymentNote = (inputState.paymentNote || '').trim();
    const proofImg = inputState.proofImg || '';

    if (!teamName) {
      notify('Escribe el nombre del equipo participante para inscribirlo.', 'error');
      return;
    }

    const targetActivity = activities.find((a) => a.id === activityId);

    setActivities((prev) =>
      prev.map((act) => {
        if (act.id !== activityId) return act;
        const already = act.registeredTeams.includes(teamName);
        return {
          ...act,
          metodosPago: paymentNote ? `${act.metodosPago} | Detalle envío: ${paymentNote}` : act.metodosPago,
          comprobantePago: proofImg || act.comprobantePago,
          registeredTeams: already ? act.registeredTeams : [...act.registeredTeams, teamName]
        };
      })
    );

    setPendingRegistrations((prev) => [
      {
        id: `reg-${Date.now()}`,
        activityTitle: targetActivity?.title || 'Actividad',
        kind: targetActivity?.kind || 'TORNEO',
        teamName,
        paymentNote: paymentNote || 'Registro directo',
        proofImg,
        status: proofImg || paymentNote ? 'COMPROBANTE ENVIADO' : 'INSCRITO',
        submittedAt: 'Ahora mismo'
      },
      ...prev
    ]);

    setRegInputs((prev) => ({
      ...prev,
      [activityId]: { teamName: '', paymentNote: '', proofImg: '' }
    }));

    const msg = `${currentRole} inscribió a "${teamName}" en ${targetActivity?.kind || 'actividad'}${
      proofImg ? ' con comprobante de pago' : ''
    }.`;
    broadcastStateChange(msg, currentRole);
    notify(`Equipo "${teamName}" registrado exitosamente en la actividad.`);
  };

    const item = pendingRegistrations.find((r) => r.id === regId);
    setPendingRegistrations((prev) =>
      prev.map((r) => (r.id === regId ? { ...r, status: nextStatus } : r))

    broadcastStateChange(
      `${currentRole} marcó como ${nextStatus} la inscripción de "${item?.teamName || 'equipo'}".`,
      currentRole
    );
    notify(`Inscripción actualizada a ${nextStatus}.`);
  };

  const handlePublishNews = (e) => {
    e.preventDefault();
    if (!newNews.title.trim()) {
      notify('Completa el titular de la noticia.', 'error');
      return;

    const published = {
      id: `news-${Date.now()}`,
      tag: newNews.tag,
      division: newNews.division,
      date: 'Actualidad NT',
      title: newNews.title.trim(),
      summary: newNews.summary.trim() || 'Comunicado oficial de NATIONAL TOURNAMENTS.',

    setNewsList((prev) => [published, ...prev]);
    broadcastStateChange(`${currentRole} publicó noticia: "${published.title}".`, currentRole);
    setNewNews({ tag: 'ANUNCIO OFICIAL', division: 'ELITE', title: '', summary: '' });
    notify('Noticia publicada en la sección editorial.');

  const handleAddSponsor = (e) => {
    e.preventDefault();
    if (!newSponsor.name.trim()) {
      notify('Ingresa el nombre del patrocinador o marca.', 'error');
      return;

    const created = {
      id: `sp-${Date.now()}`,
      name: newSponsor.name.trim().toUpperCase(),
      tier: newSponsor.tier,
      url: newSponsor.url.trim() || 'https://nationaltournaments.esports',
      benefit: newSponsor.benefit.trim() || 'Alianza estratégica con NATIONAL TOURNAMENTS.'
    };
    setSponsors((prev) => [...prev, created]);
    broadcastStateChange(`${currentRole} incorporó patrocinador "${created.name}".`, currentRole);
    setNewSponsor({ name: '', tier: 'OFFICIAL SPONSOR', url: 'https://', benefit: '' });
    notify('Patrocinador añadido a la plataforma.');
  };

  const handleAddRoleAccount = (e) => {
    e.preventDefault();
    if (!newAccount.name.trim()) {
      notify('Ingresa el nombre o responsable de la cuenta.', 'error');
      return;
    }
    const created = {
      id: `acc-${Date.now()}`,
      name: newAccount.name.trim(),
      handle: newAccount.handle.trim() || `@nt_${Date.now().toString().slice(-4)}`,
      role: newAccount.role,
      status: 'ACTIVO'
    };
    setRoleAccounts((prev) => [...prev, created]);
    broadcastStateChange(`${currentRole} asignó rango ${created.role} a "${created.name}".`, currentRole);
    setNewAccount({ name: '', handle: '', role: 'EQUIPOS' });
    notify(`Cuenta creada con rango ${created.role}.`);
  };

  const filteredActivities = useMemo(() => {
    return activities.filter((act) => {
      const matchKind = activityKindFilter === 'TODOS' || act.kind === activityKindFilter;
      const matchDiv = activeDivisionFilter === 'TODAS' || act.division === activeDivisionFilter;
      return matchKind && matchDiv;
    });
  }, [activities, activityKindFilter, activeDivisionFilter]);

  const navItems = [
    { id: 'inicio', label: 'Inicio', icon: Trophy },
    { id: 'competencias', label: 'Relámpago / Torneo / Entreno', icon: Flame },
    { id: 'equipos', label: 'Equipos y Rosters', icon: Users },
    { id: 'divisiones', label: 'Divisiones (ELITE / SERIE CUP / DID)', icon: Layers },
    { id: 'patrocinadores', label: 'Patrocinadores', icon: Handshake },
    { id: 'noticias', label: 'Noticias', icon: Newspaper },

  return (

            toast.type === 'error'

        >

          >
            <X className="w-4 h-4" />
          </button>

      {/* Top Corporate Announcement & Role Bar */}
      <div className="bg-slate-950/95 border-b border-slate-800/80 text-xs">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 flex flex-wrap items-center justify-between gap-2">
          <div className="flex items-center gap-2 text-slate-300">
            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-400/30 font-semibold tracking-wide">
              <Shield className="w-3.5 h-3.5" />
              {corporateInfo.brandName}
            </span>

            <span className="hidden md:inline text-slate-400">

          <div className="h-16 flex items-center justify-between gap-4">
            <button

              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 via-orange-500 to-amber-600 p-[1px] shadow-lg shadow-amber-500/10">
                <div className="w-full h-full rounded-[11px] bg-[#0b101d] flex items-center justify-center">

              <div>
                <div className="font-black tracking-wider text-sm sm:text-base text-white leading-none">
